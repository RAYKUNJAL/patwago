# PatWaGo Traefik dynamic config.
# Verify the live host/port before installing on the VPS:
#   docker ps --format 'table {{.Names}}\t{{.Ports}}'
#   systemctl status patwago
# server.js defaults to PORT=3000, so this points to one app process.
http:
  routers:
    patwago-app:
      rule: "Host(`patwago.com`) || Host(`www.patwago.com`)"
      entryPoints:
        - http
        - https
      service: patwago-app
      tls:
        certResolver: letsencrypt
      priority: 1
  services:
    patwago-app:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:3000"
